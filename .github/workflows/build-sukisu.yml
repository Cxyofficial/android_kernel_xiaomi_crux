name: Build crux kernel (SukiSU + SUSFS 2.2.0)

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "SukiSU-Ultra ref (branch / tag / commit)"
        required: false
        default: "builtin"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev zip unzip cpio xz-utils curl wget python3 git

      - name: "Toolchain: AOSP clang r383902 (fallback distro clang)"
        run: |
          set -e
          mkdir -p "$HOME/tc" && cd "$HOME/tc"
          if curl -fsSL --retry 3 -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902.tar.gz"; then
            mkdir -p clang && tar -xzf clang.tar.gz -C clang
            echo "TC=$HOME/tc/clang/bin" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -qq clang lld
            echo "TC=/usr/bin" >> "$GITHUB_ENV"
          fi

      - name: "Replace manager: integrate SukiSU-Ultra"
        env:
          KSU_REF: ${{ inputs.ksu_ref }}
        run: |
          set -eux
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra KernelSU
          git -C KernelSU fetch --depth=1 origin "$KSU_REF"
          git -C KernelSU checkout -q FETCH_HEAD
          git -C KernelSU log --oneline -1
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q kernelsu drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          python3 ci/sukisu_compat.py drivers/kernelsu

      - name: Build kernel
        run: |
          set -eux
          export PATH="$TC:$PATH"
          MK="make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
          $MK crux_defconfig
          $MK prepare
          # host tools (genheaders, dtc, ...) are needed before the tree is built
          $MK scripts
          # KSU pulls in security/selinux/ss/policydb.h, which needs the generated flask.h
          mkdir -p out/security/selinux
          ./out/scripts/selinux/genheaders/genheaders out/security/selinux/flask.h out/security/selinux/av_permissions.h
          $MK -j"$(nproc)" Image.gz-dtb
          grep -E '^CONFIG_(KSU|KSU_SUSFS)' out/.config
          ls -l out/arch/arm64/boot/Image.gz-dtb

      - name: Package AnyKernel3
        run: |
          set -eux
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          sed -i 's/^kernel.string=.*/kernel.string=crux kernel - SukiSU-Ultra + SUSFS v2.2.0/' anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=crux/' anykernel.sh
          sed -i 's/^BLOCK=.*/BLOCK=\/dev\/block\/bootdevice\/by-name\/boot;/' anykernel.sh
          cp ../out/arch/arm64/boot/Image.gz-dtb .
          zip -r9 "../crux-SukiSU-susfs2.2.0-${GITHUB_RUN_NUMBER}.zip" . -x '.git/*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crux-kernel-${{ github.run_number }}
          path: |
            crux-*.zip
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
